<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contes Dart – Anzeige</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      color: #e8e8f0;
      font-family: 'Rajdhani', system-ui, sans-serif;
      overflow: hidden;
    }
    .screen {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: #000;
      position: relative;
    }
    .header {
      display: none;
      justify-content: space-between;
      align-items: baseline;
      padding: 0.7rem 1.2rem 0.5rem;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      flex-shrink: 0;
    }
    .screen.live .header { display: flex; }
    .title {
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: clamp(1rem, 2.5vw, 1.6rem);
      letter-spacing: 0.14em;
      background: linear-gradient(135deg, #00f0ff, #ff00aa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .meta {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(0.75rem, 1.8vw, 1rem);
      color: #8a8aa0;
      letter-spacing: 0.08em;
    }
    .meta span { color: #e8e8f0; font-weight: 700; }

    .grid {
      display: none;
      flex: 1;
      min-height: 0;
      grid-template-columns: repeat(auto-fit, minmax(min(180px, 100%), 1fr));
      gap: 0.7rem;
      padding: 0.6rem 1rem 0.3rem;
      align-content: center;
      overflow: hidden;
    }
    .screen.live .grid { display: grid; }
    .grid.players-4 {
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
    }

    .card {
      background: #0a0a12;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 0.7rem 0.6rem;
      text-align: center;
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 0;
      overflow: hidden;
    }
    .card.active {
      border-color: #00f0ff;
      box-shadow: 0 0 28px rgba(0,240,255,0.25);
      transform: scale(1.02);
    }

    .card.ai-card {
      border-color: rgba(255,0,170,0.35);
    }
    .card.ai-card.active {
      border-color: #ff00aa;
      box-shadow: 0 0 28px rgba(255,0,170,0.3);
    }
    .card.ai-card.active .card-name { color: #ff00aa; }
    .card.ai-card.active .card-score { color: #ff00aa; }
    .card.ai-card .card-name { color: #ff00aa; }
    .badge.ai {
      background: rgba(255,0,170,0.15);
      color: #ff00aa;
    }

    .card.winner {
      border-color: #00ff88;
      box-shadow: 0 0 36px rgba(0,255,136,0.3);
    }
    .card-name {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(0.75rem, 1.8vw, 1.15rem);
      letter-spacing: 0.08em;
      color: #8a8aa0;
      margin-bottom: 0.25rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card.active .card-name { color: #00f0ff; }
    .card.winner .card-name { color: #00ff88; }
    .card-score {
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: clamp(2.2rem, 9vh, 5.5rem);
      line-height: 1;
      color: #e8e8f0;
    }
    .card.active .card-score { color: #00f0ff; }
    .card.winner .card-score { color: #00ff88; }
    .card-meta {
      margin-top: 0.3rem;
      font-size: clamp(0.7rem, 1.4vw, 1rem);
      color: #8a8aa0;
    }
    .badge {
      display: inline-block;
      margin-top: 0.35rem;
      padding: 0.15rem 0.55rem;
      border-radius: 999px;
      font-size: 0.7rem;
      letter-spacing: 0.08em;
      font-weight: 700;
    }
    .badge.active {
      background: rgba(0,240,255,0.15);
      color: #00f0ff;
    }
    .badge.winner {
      background: rgba(0,255,136,0.15);
      color: #00ff88;
    }

    .checkout-bar {
      display: none;
      margin: 0.3rem 1rem 0.7rem;
      padding: 0.55rem 1rem;
      border-radius: 12px;
      background: rgba(0, 255, 136, 0.08);
      border: 1px solid rgba(0, 255, 136, 0.3);
      text-align: center;
      flex-shrink: 0;
    }
    .screen.live .checkout-bar.visible { display: block; }
    .checkout-label {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(0.65rem, 1.3vw, 0.85rem);
      letter-spacing: 0.15em;
      color: #8a8aa0;
      margin-bottom: 0.2rem;
    }
    .checkout-text {
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      font-size: clamp(1rem, 2.8vw, 1.7rem);
      letter-spacing: 0.06em;
      color: #00ff88;
    }
    .checkout-player {
      margin-top: 0.2rem;
      font-size: clamp(0.75rem, 1.5vw, 0.95rem);
      color: #00f0ff;
    }


    .gameover-overlay {
      position: absolute;
      inset: 0;
      z-index: 35;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.9);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.35s ease, visibility 0.35s;
    }
    .gameover-overlay.show {
      opacity: 1;
      visibility: visible;
    }
    .gameover-card { text-align: center; padding: 2rem; }
    .gameover-label {
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: clamp(2.5rem, 12vw, 6.5rem);
      letter-spacing: 0.14em;
      color: #ff6b00;
      text-shadow: 0 0 40px rgba(255, 107, 0, 0.75), 0 0 80px rgba(255, 50, 0, 0.4);
      animation: goPulse 0.7s ease-in-out infinite alternate;
    }
    .gameover-sub {
      margin-top: 1.2rem;
      color: #c0c0d0;
      font-size: clamp(1rem, 2.5vw, 1.6rem);
      letter-spacing: 0.1em;
      font-family: 'Orbitron', sans-serif;
    }
    @keyframes goPulse {
      from { filter: drop-shadow(0 0 10px rgba(255,107,0,0.45)); }
      to   { filter: drop-shadow(0 0 36px rgba(255,107,0,1)); }
    }

    .winner-overlay {
      position: absolute;
      inset: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.88);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.4s ease, visibility 0.4s;
    }
    .winner-overlay.show {
      opacity: 1;
      visibility: visible;
    }
    .winner-card {
      text-align: center;
      padding: 2rem;
      animation: winnerPop 0.55s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes winnerPop {
      0% { transform: scale(0.4); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .winner-label {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(1rem, 2.5vw, 1.4rem);
      letter-spacing: 0.25em;
      color: #00ff88;
      margin-bottom: 1rem;
    }
    .winner-name {
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: clamp(3rem, 14vw, 7rem);
      letter-spacing: 0.06em;
      line-height: 1.05;
      background: linear-gradient(135deg, #00ff88, #00f0ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: winnerGlow 0.7s ease-in-out infinite alternate;
    }
    @keyframes winnerGlow {
      from { filter: drop-shadow(0 0 12px rgba(0,255,136,0.4)); }
      to   { filter: drop-shadow(0 0 40px rgba(0,255,136,0.95)); }
    }
    .winner-sub {
      margin-top: 1.4rem;
      color: #8a8aa0;
      font-size: clamp(1rem, 2vw, 1.3rem);
      letter-spacing: 0.08em;
    }

    .bust-overlay {
      position: absolute;
      inset: 0;
      z-index: 25;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(20, 0, 0, 0.9);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.25s ease, visibility 0.25s;
    }
    .bust-overlay.show {
      opacity: 1;
      visibility: visible;
    }
    .bust-card {
      text-align: center;
      padding: 2rem;
      animation: bustPop 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes bustPop {
      0% { transform: scale(0.35); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .bust-label {
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: clamp(4rem, 18vw, 9rem);
      letter-spacing: 0.12em;
      color: #ff6b00;
      text-shadow: 0 0 40px rgba(255, 107, 0, 0.8), 0 0 80px rgba(255, 107, 0, 0.45);
      animation: bustPulse 0.45s ease-in-out infinite alternate;
    }
    @keyframes bustPulse {
      from { filter: drop-shadow(0 0 10px rgba(255,107,0,0.5)); }
      to   { filter: drop-shadow(0 0 40px rgba(255,107,0,1)); }
    }
    .bust-sub {
      margin-top: 1.2rem;
      color: #c0c0d0;
      font-size: clamp(1.1rem, 3vw, 1.8rem);
      letter-spacing: 0.08em;
    }


    .hit-overlay {
      position: absolute;
      inset: 0;
      z-index: 28;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.25s ease, visibility 0.25s;
    }
    .hit-overlay.show {
      opacity: 1;
      visibility: visible;
    }
    .hit-label {
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: clamp(2.5rem, 12vw, 6rem);
      letter-spacing: 0.08em;
      text-align: center;
      animation: hitPop 1.4s cubic-bezier(0.22, 1.2, 0.36, 1) forwards;
      text-shadow: 0 0 40px currentColor;
    }
    .hit-label.bull { color: #ffd700; }
    .hit-label.dbull { color: #ff00aa; }
    .hit-label.oneeighty { color: #00f0ff; }
    .hit-sub {
      margin-top: 0.6rem;
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(0.9rem, 2.5vw, 1.4rem);
      letter-spacing: 0.12em;
      color: #8a8aa0;
      text-align: center;
    }
    @keyframes hitPop {
      0%   { opacity: 0; transform: scale(0.35); }
      20%  { opacity: 1; transform: scale(1.12); }
      70%  { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(0.9); }
    }


    .throws-bar {
      display: none;
      flex-shrink: 0;
      margin: 0 1rem 0.5rem;
      padding: 0.55rem 0.9rem;
      border-radius: 12px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      min-height: 0;
    }
    .screen.live .throws-bar { display: block; }
    .throws-bar.hidden-by-overlay { display: none !important; }
    .throws-current {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(0.7rem, 1.5vw, 0.95rem);
      letter-spacing: 0.08em;
      color: #00f0ff;
      margin-bottom: 0.35rem;
    }
    .throws-current span { color: #e8e8f0; font-weight: 700; }
    .throws-current .sum { color: #00ff88; }
    .throws-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      align-items: center;
    }
    .throw-chip {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.25rem 0.55rem;
      border-radius: 999px;
      background: rgba(0,0,0,0.35);
      border: 1px solid rgba(255,255,255,0.1);
      font-size: clamp(0.7rem, 1.4vw, 0.9rem);
      letter-spacing: 0.04em;
    }
    .throw-chip .who {
      color: #8a8aa0;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.75em;
      max-width: 7em;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .throw-chip .pts {
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      color: #00f0ff;
    }
    .throw-chip.fresh {
      border-color: rgba(0,240,255,0.45);
      box-shadow: 0 0 12px rgba(0,240,255,0.2);
    }
    .throws-empty {
      color: #8a8aa0;
      font-size: clamp(0.7rem, 1.3vw, 0.85rem);
      letter-spacing: 0.06em;
    }



    #confetti-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 30;
    }
  </style>
</head>
<body>
  <div class="screen idle" id="screen">
    <div class="header">
      <div class="title">CONTES DART</div>
      <div class="meta" id="meta"></div>
    </div>

    <div class="grid" id="grid"></div>

    <div class="checkout-bar" id="checkout-bar">
      <div class="checkout-label">CHECKOUT</div>
      <div class="checkout-text" id="checkout-text">—</div>
      <div class="checkout-player" id="checkout-player"></div>
    </div>

    <div class="throws-bar" id="throws-bar">
      <div class="throws-current" id="throws-current"></div>
      <div class="throws-list" id="throws-list"></div>
    </div>

    <div class="winner-overlay" id="winner-overlay">
      <div class="winner-card">
        <div class="winner-label" id="winner-label">GEWINNER</div>
        <div class="winner-name" id="winner-name">—</div>
        <div class="winner-sub" id="winner-sub">Glückwunsch!</div>
      </div>
    </div>

    <div class="gameover-overlay" id="gameover-overlay">
      <div class="gameover-card">
        <div class="gameover-label">GAME OVER</div>
        <div class="gameover-sub" id="gameover-sub">Spiel beendet</div>
      </div>
    </div>

    <div class="bust-overlay" id="bust-overlay">
      <div class="bust-card">
        <div class="bust-label">BUST</div>
        <div class="bust-sub" id="bust-sub">Zug ungültig</div>
      </div>
    </div>

    <div class="hit-overlay" id="hit-overlay">
      <div>
        <div class="hit-label" id="hit-label">BULL!</div>
        <div class="hit-sub" id="hit-sub"></div>
      </div>
    </div>
    <canvas id="confetti-canvas"></canvas>
  </div>

  <script>
    const commonCheckouts = {
      170: 'T20 T20 Bull', 167: 'T20 T19 Bull', 164: 'T20 T18 Bull', 161: 'T20 T17 Bull',
      160: 'T20 T20 D20', 158: 'T20 T20 D19', 157: 'T20 T19 D20', 156: 'T20 T20 D18',
      155: 'T20 T19 D19', 154: 'T20 T18 D20', 152: 'T20 T20 D16', 151: 'T20 T17 D20',
      150: 'T20 T18 D18', 149: 'T20 T19 D16', 148: 'T20 T16 D20', 147: 'T20 T17 D18',
      146: 'T20 T18 D16', 145: 'T20 T15 D20', 144: 'T20 T20 D12', 143: 'T20 T17 D16',
      142: 'T20 T14 D20', 141: 'T20 T19 D12', 140: 'T20 T20 D10', 136: 'T20 T20 D8',
      132: 'T20 T16 D12', 130: 'T20 T20 D5', 120: 'T20 20 D20', 110: 'T20 10 D20',
      100: 'T20 D20', 98: 'T20 D19', 96: 'T20 D18', 80: 'T20 D10', 60: '20 D20',
      50: 'Bull', 40: 'D20', 36: 'D18', 32: 'D16', 24: 'D12', 20: 'D10',
      16: 'D8', 12: 'D6', 10: 'D5', 8: 'D4', 6: 'D3', 4: 'D2', 2: 'D1'
    };

    function getCheckout(score) {
      if (!score || score > 170 || score === 0) return null;
      if (commonCheckouts[score]) return commonCheckouts[score];
      if (score <= 40 && score % 2 === 0) return 'D' + (score / 2);
      return null;
    }


    /* ========== SOUND (optional on display) ========== */
    const soundState = {
      muted: false,
      ctx: null
    };
    function getAudioCtx() {
      if (!soundState.ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        soundState.ctx = new AC();
      }
      if (soundState.ctx.state === 'suspended') soundState.ctx.resume().catch(() => {});
      return soundState.ctx;
    }
    function tone(freq, duration, type = 'sine', volume = 0.12, when = 0) {
      if (soundState.muted) return;
      const ctx = getAudioCtx();
      if (!ctx) return;
      const t0 = ctx.currentTime + when;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, t0);
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(volume, t0 + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(t0);
      osc.stop(t0 + duration + 0.05);
    }
    function noiseBurst(duration = 0.15, volume = 0.08) {
      if (soundState.muted) return;
      const ctx = getAudioCtx();
      if (!ctx) return;
      const len = Math.floor(ctx.sampleRate * duration);
      const buffer = ctx.createBuffer(1, len, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
      const src = ctx.createBufferSource();
      const gain = ctx.createGain();
      const filter = ctx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.value = 800;
      src.buffer = buffer;
      gain.gain.value = volume;
      src.connect(filter);
      filter.connect(gain);
      gain.connect(ctx.destination);
      src.start();
    }
    function playSound(name) {
      if (soundState.muted) return;
      try {
        getAudioCtx();
        if (name === 'bull') {
          tone(660, 0.12, 'sine', 0.11); tone(880, 0.14, 'triangle', 0.09, 0.08); tone(1320, 0.18, 'sine', 0.07, 0.16);
        } else if (name === 'dbull') {
          tone(740, 0.1, 'sine', 0.11); tone(990, 0.12, 'triangle', 0.1, 0.07); tone(1480, 0.16, 'sine', 0.08, 0.14);
        } else if (name === '180') {
          tone(523, 0.1, 'square', 0.07); tone(659, 0.1, 'square', 0.07, 0.09); tone(784, 0.1, 'square', 0.07, 0.18); tone(1046, 0.22, 'sine', 0.1, 0.28);
        } else if (name === 'bust') {
          noiseBurst(0.18, 0.1); tone(180, 0.28, 'sawtooth', 0.09); tone(120, 0.35, 'sine', 0.08, 0.08);
        } else if (name === 'win') {
          [523, 659, 784, 1046, 784, 1046, 1318].forEach((f, i) => tone(f, 0.22, i > 4 ? 'sine' : 'triangle', 0.1, i * 0.12));
        } else if (name === 'lose') {
          tone(400, 0.25, 'sawtooth', 0.09);
          tone(300, 0.3, 'sawtooth', 0.08, 0.2);
          tone(180, 0.45, 'sine', 0.1, 0.4);
          tone(120, 0.55, 'sine', 0.08, 0.55);
        } else if (name === 'gameover') {
          tone(220, 0.35, 'triangle', 0.1);
          tone(165, 0.4, 'sine', 0.09, 0.25);
          tone(110, 0.6, 'sine', 0.08, 0.5);
        }
      } catch (e) {}
    }
    document.addEventListener('click', () => getAudioCtx(), { once: true });

    /* ========== CONFETTI ========== */
    const confettiCanvas = document.getElementById('confetti-canvas');
    const confettiCtx = confettiCanvas.getContext('2d');
    let confettiParticles = [];
    let confettiRaf = null;
    let lastWinnerFired = null;
    let lastGameOverKey = null;
    let lastBustShown = false;

    function resizeConfetti() {
      confettiCanvas.width = confettiCanvas.clientWidth || window.innerWidth;
      confettiCanvas.height = confettiCanvas.clientHeight || window.innerHeight;
    }
    window.addEventListener('resize', resizeConfetti);
    resizeConfetti();

    const CONFETTI_COLORS = [
      '#00f0ff', '#ff00aa', '#00ff88', '#ffd700', '#ff6b00',
      '#ffffff', '#a855f7', '#38bdf8', '#f472b6', '#fbbf24'
    ];

    function spawnConfetti(opts = {}) {
      const {
        count = 140,
        originX = 0.5,
        originY = 0.12,
        spread = 0.9,
        velocity = 15,
        gravity = 0.17,
        duration = 4000
      } = opts;
      const w = confettiCanvas.width;
      const h = confettiCanvas.height;
      const ox = originX * w;
      const oy = originY * h;
      for (let i = 0; i < count; i++) {
        const angle = (Math.random() - 0.5) * Math.PI * spread - Math.PI / 2;
        const speed = velocity * (0.55 + Math.random() * 0.7);
        confettiParticles.push({
          x: ox + (Math.random() - 0.5) * 50,
          y: oy + (Math.random() - 0.5) * 20,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          g: gravity * (0.85 + Math.random() * 0.4),
          w: 7 + Math.random() * 9,
          h: 4 + Math.random() * 11,
          rot: Math.random() * Math.PI * 2,
          rotSpeed: (Math.random() - 0.5) * 0.28,
          color: CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)],
          shape: Math.random() < 0.33 ? 'circle' : (Math.random() < 0.5 ? 'ribbon' : 'rect'),
          life: 1,
          decay: 1 / (duration / 16 * (0.7 + Math.random() * 0.6))
        });
      }
      if (!confettiRaf) confettiLoop();
    }

    function confettiLoop() {
      confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
      confettiParticles = confettiParticles.filter(p => {
        p.vy += p.g;
        p.vx *= 0.993;
        p.x += p.vx;
        p.y += p.vy;
        p.rot += p.rotSpeed;
        p.life -= p.decay;
        if (p.life <= 0 || p.y > confettiCanvas.height + 40) return false;
        confettiCtx.save();
        confettiCtx.translate(p.x, p.y);
        confettiCtx.rotate(p.rot);
        confettiCtx.globalAlpha = Math.max(0, p.life);
        confettiCtx.fillStyle = p.color;
        if (p.shape === 'circle') {
          confettiCtx.beginPath();
          confettiCtx.arc(0, 0, p.w * 0.45, 0, Math.PI * 2);
          confettiCtx.fill();
        } else if (p.shape === 'ribbon') {
          confettiCtx.fillRect(-p.w * 0.15, -p.h * 0.6, p.w * 0.3, p.h * 1.2);
        } else {
          confettiCtx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        }
        confettiCtx.restore();
        return true;
      });
      if (confettiParticles.length > 0) {
        confettiRaf = requestAnimationFrame(confettiLoop);
      } else {
        confettiRaf = null;
        confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
      }
    }

    function fireWinConfetti() {
      spawnConfetti({ count: 180, originY: 0.08, velocity: 17, duration: 5000 });
      setTimeout(() => spawnConfetti({ count: 110, originX: 0.18, originY: 0.12, velocity: 14 }), 180);
      setTimeout(() => spawnConfetti({ count: 110, originX: 0.82, originY: 0.12, velocity: 14 }), 320);
      setTimeout(() => spawnConfetti({ count: 90, originX: 0.5, originY: 0.05, velocity: 13 }), 550);
    }

    function fireBullConfetti() {
      spawnConfetti({ count: 100, originY: 0.1, velocity: 14, duration: 3000 });
      spawnConfetti({ count: 55, originX: 0.22, originY: 0.08, velocity: 12, duration: 2600 });
      spawnConfetti({ count: 55, originX: 0.78, originY: 0.08, velocity: 12, duration: 2600 });
    }

    function fire180Confetti() {
      spawnConfetti({ count: 120, originY: 0.1, velocity: 16, duration: 3400 });
      spawnConfetti({ count: 60, originX: 0.28, originY: 0.12, velocity: 13, duration: 2800 });
      spawnConfetti({ count: 60, originX: 0.72, originY: 0.12, velocity: 13, duration: 2800 });
    }

    let lastEventAt = null;
    let hitHideTimer = null;

    function showHitOverlay(type, player) {
      const overlay = document.getElementById('hit-overlay');
      const label = document.getElementById('hit-label');
      const sub = document.getElementById('hit-sub');
      if (!overlay || !label) return;

      label.className = 'hit-label';
      if (type === 'dbull') {
        label.textContent = 'DOUBLE BULL!';
        label.classList.add('dbull');
      } else if (type === '180') {
        label.textContent = '180!';
        label.classList.add('oneeighty');
      } else {
        label.textContent = type === 'bull' && false ? 'BULL 50!' : 'BULL!';
        if (type === 'bull') label.textContent = 'BULL!';
        label.classList.add('bull');
      }
      sub.textContent = player ? player : '';

      // restart animation
      label.style.animation = 'none';
      void label.offsetWidth;
      label.style.animation = '';

      overlay.classList.add('show');
      if (hitHideTimer) clearTimeout(hitHideTimer);
      hitHideTimer = setTimeout(() => overlay.classList.remove('show'), 1600);
    }

    function handleLastEvent(ev) {
      if (!ev || !ev.at || ev.at === lastEventAt) return;
      lastEventAt = ev.at;
      resizeConfetti();
      if (ev.type === 'dbull') {
        fireBullConfetti();
        showHitOverlay('dbull', ev.player);
        playSound('dbull');
      } else if (ev.type === 'bull') {
        fireBullConfetti();
        showHitOverlay('bull', ev.player);
        playSound('bull');
      } else if (ev.type === '180') {
        fire180Confetti();
        showHitOverlay('180', ev.player);
        playSound('180');
      }
    }

    async function loadState() {
      try {
        const res = await fetch('/api/state');
        const data = await res.json();
        render(data);
      } catch (e) {
        console.error(e);
      }
    }

    function render(data) {
      const screen = document.getElementById('screen');
      const grid = document.getElementById('grid');
      const meta = document.getElementById('meta');
      const overlay = document.getElementById('winner-overlay');
      const winnerName = document.getElementById('winner-name');
      const bustOverlay = document.getElementById('bust-overlay');
      const bustSub = document.getElementById('bust-sub');
      const checkoutBar = document.getElementById('checkout-bar');
      const checkoutText = document.getElementById('checkout-text');
      const checkoutPlayer = document.getElementById('checkout-player');

      const showBust = !!data.bust;
      const showAbort = !!(data.aborted && data.gameOver);
      const winnerIsAI = !!(data.winner && Array.isArray(data.players) && data.players.some(p => p && p.isAI && p.name === data.winner));
      const showLose = !!(data.gameOver && data.winner && (data.humanLost || winnerIsAI));
      const showWinner = !!(data.gameOver && data.winner && !showLose && !showAbort);
      // Keep end screens visible even if active=false; only idle when nothing to show
      const showIdle = (!data.players || data.players.length === 0) && !showWinner && !showLose && !showAbort && !showBust;

      if (showIdle) {
        screen.className = 'screen idle';
        grid.innerHTML = '';
        grid.className = 'grid';
        overlay.classList.remove('show');
        if (bustOverlay) bustOverlay.classList.remove('show');
        checkoutBar.classList.remove('visible');
        const goIdle = document.getElementById('gameover-overlay');
        if (goIdle) goIdle.classList.remove('show');
        const throwsBarIdle = document.getElementById('throws-bar');
        if (throwsBarIdle) throwsBarIdle.classList.add('hidden-by-overlay');
        lastWinnerFired = null;
        lastGameOverKey = null;
        lastEventAt = null;
        return;
      }

      screen.className = 'screen live';
      const vsLabel = data.vsAI ? ' &nbsp;·&nbsp; <span style="color:#ff00aa">VS KI</span>' : '';
      meta.innerHTML = `Modus: <span>${data.mode || '—'}</span> &nbsp;·&nbsp; Runde: <span>${data.round || 1}</span>${vsLabel}`;
      grid.className = 'grid' + ((data.players && data.players.length === 4) ? ' players-4' : '');

      const goOverlay = document.getElementById('gameover-overlay');
      const goSub = document.getElementById('gameover-sub');

      if (showAbort) {
        if (goSub) goSub.textContent = 'Spiel manuell beendet';
        if (goOverlay) goOverlay.classList.add('show');
        overlay.classList.remove('show');
        if (bustOverlay) bustOverlay.classList.remove('show');
        checkoutBar.classList.remove('visible');
        const key = 'abort-' + (data.updatedAt || data.winner || 'x');
        if (lastGameOverKey !== key) {
          lastGameOverKey = key;
          playSound('gameover');
        }
      } else if (showLose) {
        if (goSub) goSub.textContent = (data.winner || 'Dart-KI') + ' gewinnt';
        if (goOverlay) goOverlay.classList.add('show');
        overlay.classList.remove('show');
        if (bustOverlay) bustOverlay.classList.remove('show');
        checkoutBar.classList.remove('visible');
        const key = 'lose-' + (data.winner || '') + '-' + (data.updatedAt || '');
        if (lastGameOverKey !== key) {
          lastGameOverKey = key;
          playSound('lose');
        }
      } else if (showBust) {
        if (bustSub) {
          bustSub.textContent = data.bustPlayer
            ? `${data.bustPlayer} · Zug ungültig`
            : 'Zug ungültig';
        }
        if (bustOverlay) bustOverlay.classList.add('show');
        overlay.classList.remove('show');
        checkoutBar.classList.remove('visible');
        if (!lastBustShown) {
          lastBustShown = true;
          playSound('bust');
        }
      } else if (showWinner) {
        lastBustShown = false;
        winnerName.textContent = data.winner;
        overlay.classList.add('show');
        if (bustOverlay) bustOverlay.classList.remove('show');
        checkoutBar.classList.remove('visible');
        if (lastWinnerFired !== data.winner) {
          lastWinnerFired = data.winner;
          resizeConfetti();
          fireWinConfetti();
          playSound('win');
        }
      } else {
        overlay.classList.remove('show');
        if (bustOverlay) bustOverlay.classList.remove('show');
        if (goOverlay) goOverlay.classList.remove('show');
        lastWinnerFired = null;
        lastGameOverKey = null;
        lastBustShown = false;
        const current = data.players[data.currentPlayer];
        const hint = current ? getCheckout(current.score) : null;
        if (hint && current) {
          checkoutText.textContent = hint;
          checkoutPlayer.textContent = current.name + ' · ' + current.score + ' Rest';
          checkoutBar.classList.add('visible');
        } else {
          checkoutBar.classList.remove('visible');
        }
      }

      // Special throw events (Bull / DBull / 180) from main app
      if (data.lastEvent) handleLastEvent(data.lastEvent);

      // Throws history on display
      const throwsBar = document.getElementById('throws-bar');
      const throwsCurrent = document.getElementById('throws-current');
      const throwsList = document.getElementById('throws-list');
      if (throwsBar && throwsList) {
        if (showBust || showWinner || showLose || showAbort) {
          throwsBar.classList.add('hidden-by-overlay');
        } else {
          throwsBar.classList.remove('hidden-by-overlay');
          const turn = data.turnThrows || [];
          const curPlayer = (data.players && data.players[data.currentPlayer])
            ? data.players[data.currentPlayer].name
            : '';
          const turnIdx = (data.turnThrowIndex != null) ? data.turnThrowIndex : turn.length;
          if (throwsCurrent) {
            if (turn.length > 0) {
              const sum = turn.reduce((a, b) => a + b, 0);
              const parts = turn.map((v, i) => `W${i + 1}: ${v}`).join(' · ');
              throwsCurrent.innerHTML =
                `<span>${curPlayer}</span> · ${parts} · Summe: <span class="sum">${sum}</span>` +
                (turnIdx < 3 ? ` · Wurf ${turnIdx + 1}/3` : '');
            } else if (curPlayer) {
              throwsCurrent.innerHTML = `<span>${curPlayer}</span> · Wurf 1 von 3`;
            } else {
              throwsCurrent.textContent = '';
            }
          }
          const recent = data.recentThrows || [];
          if (recent.length === 0) {
            throwsList.innerHTML = '<span class="throws-empty">Noch keine Würfe</span>';
          } else {
            throwsList.innerHTML = recent.map((e, i) => `
              <div class="throw-chip${i === 0 ? ' fresh' : ''}">
                <span class="who">${e.player || ''}</span>
                <span class="pts">-${e.score}</span>
              </div>
            `).join('');
          }
        }
      }

      grid.innerHTML = data.players.map((p, idx) => {
        const isActive = !data.gameOver && !showBust && idx === data.currentPlayer;
        const isWinner = data.gameOver && data.winner === p.name;
        const isAI = !!p.isAI;
        let cls = 'card';
        if (isActive) cls += ' active';
        if (isWinner) cls += ' winner';
        if (isAI) cls += ' ai-card';
        let badge = '';
        if (isActive) badge = isAI
          ? '<div class="badge ai">KI AM ZUG</div>'
          : '<div class="badge active">AM ZUG</div>';
        if (isWinner) badge = '<div class="badge winner">SIEGER</div>';
        if (isAI && !isActive && !isWinner) badge = '<div class="badge ai">KI</div>';
        return `
          <div class="${cls}">
            <div class="card-name">${p.name}</div>
            <div class="card-score">${p.score}</div>
            <div class="card-meta">${p.dartsThrown || 0} Darts</div>
            ${badge}
          </div>
        `;
      }).join('');
    }

    loadState();
    setInterval(loadState, 800);
  </script>
</body>
</html>
