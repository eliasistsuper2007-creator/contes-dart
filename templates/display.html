<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contes Dart – Anzeige</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      color: #e8e8f0;
      font-family: 'Rajdhani', system-ui, sans-serif;
      overflow: hidden;
    }
    .screen {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: #000;
      position: relative;
    }
    .header {
      display: none;
      justify-content: space-between;
      align-items: baseline;
      padding: 1.2rem 1.5rem 0.8rem;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      flex-shrink: 0;
    }
    .screen.live .header { display: flex; }
    .title {
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: clamp(1.1rem, 2.8vw, 1.8rem);
      letter-spacing: 0.14em;
      background: linear-gradient(135deg, #00f0ff, #ff00aa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .meta {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(0.85rem, 1.8vw, 1.15rem);
      color: #8a8aa0;
      letter-spacing: 0.08em;
    }
    .meta span { color: #e8e8f0; font-weight: 700; }

    .grid {
      display: none;
      flex: 1;
      gap: 1rem;
      padding: 1rem 1.2rem 0.4rem;
      align-content: center;
      min-height: 0;
    }
    .screen.live .grid { display: grid; }

    /* Adaptive columns by player count */
    .grid.players-1 { grid-template-columns: minmax(0, 420px); justify-content: center; }
    .grid.players-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .grid.players-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .grid.players-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }

    .card {
      background: #0a0a12;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px;
      padding: 1.2rem 0.8rem;
      text-align: center;
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-width: 0;
      overflow: hidden;
    }
    .card.active {
      border-color: #00f0ff;
      box-shadow: 0 0 40px rgba(0,240,255,0.25);
      transform: scale(1.03);
    }
    .card.winner {
      border-color: #00ff88;
      box-shadow: 0 0 50px rgba(0,255,136,0.3);
    }
    .card-name {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(0.85rem, 1.8vw, 1.25rem);
      letter-spacing: 0.06em;
      color: #8a8aa0;
      margin-bottom: 0.35rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card.active .card-name { color: #00f0ff; }
    .card.winner .card-name { color: #00ff88; }

    .card-score {
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: clamp(2.4rem, 9vw, 6.5rem);
      line-height: 1;
      color: #e8e8f0;
    }
    .grid.players-4 .card-score {
      font-size: clamp(2.2rem, 7.5vw, 5rem);
    }
    .grid.players-3 .card-score {
      font-size: clamp(2.6rem, 8.5vw, 5.8rem);
    }
    .card.active .card-score { color: #00f0ff; }
    .card.winner .card-score { color: #00ff88; }

    .card-meta {
      margin-top: 0.5rem;
      font-size: clamp(0.85rem, 1.5vw, 1.1rem);
      color: #8a8aa0;
    }
    .badge {
      display: inline-block;
      margin-top: 0.5rem;
      padding: 0.2rem 0.65rem;
      border-radius: 999px;
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      font-weight: 700;
    }
    .badge.active {
      background: rgba(0,240,255,0.15);
      color: #00f0ff;
    }
    .badge.winner {
      background: rgba(0,255,136,0.15);
      color: #00ff88;
    }

    /* Checkout-Leiste unten */
    .checkout-bar {
      display: none;
      margin: 0.4rem 1.5rem 1.2rem;
      padding: 0.9rem 1.2rem;
      border-radius: 14px;
      background: rgba(0, 255, 136, 0.08);
      border: 1px solid rgba(0, 255, 136, 0.3);
      text-align: center;
      flex-shrink: 0;
    }
    .screen.live .checkout-bar.visible { display: block; }
    .checkout-label {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(0.7rem, 1.3vw, 0.9rem);
      letter-spacing: 0.15em;
      color: #8a8aa0;
      margin-bottom: 0.3rem;
    }
    .checkout-text {
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      font-size: clamp(1.15rem, 3vw, 2rem);
      letter-spacing: 0.05em;
      color: #00ff88;
    }
    .checkout-player {
      margin-top: 0.3rem;
      font-size: clamp(0.85rem, 1.6vw, 1.05rem);
      color: #00f0ff;
    }

    .winner-overlay {
      position: absolute;
      inset: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.88);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.4s ease, visibility 0.4s;
    }
    .winner-overlay.show {
      opacity: 1;
      visibility: visible;
    }
    .winner-card {
      text-align: center;
      padding: 2rem;
      animation: winnerPop 0.55s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes winnerPop {
      0% { transform: scale(0.4); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .winner-label {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(1rem, 2.5vw, 1.4rem);
      letter-spacing: 0.25em;
      color: #00ff88;
      margin-bottom: 1rem;
    }
    .winner-name {
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: clamp(3rem, 14vw, 7rem);
      letter-spacing: 0.06em;
      line-height: 1.05;
      background: linear-gradient(135deg, #00ff88, #00f0ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: winnerGlow 0.7s ease-in-out infinite alternate;
    }
    @keyframes winnerGlow {
      from { filter: drop-shadow(0 0 12px rgba(0,255,136,0.4)); }
      to   { filter: drop-shadow(0 0 40px rgba(0,255,136,0.95)); }
    }
    .winner-sub {
      margin-top: 1.4rem;
      color: #8a8aa0;
      font-size: clamp(1rem, 2vw, 1.3rem);
      letter-spacing: 0.08em;
    }
  </style>
</head>
<body>
  <div class="screen idle" id="screen">
    <div class="header">
      <div class="title">CONTES DART</div>
      <div class="meta" id="meta"></div>
    </div>

    <div class="grid" id="grid"></div>

    <div class="checkout-bar" id="checkout-bar">
      <div class="checkout-label">CHECKOUT</div>
      <div class="checkout-text" id="checkout-text">—</div>
      <div class="checkout-player" id="checkout-player"></div>
    </div>

    <div class="winner-overlay" id="winner-overlay">
      <div class="winner-card">
        <div class="winner-label">GEWINNER</div>
        <div class="winner-name" id="winner-name">—</div>
        <div class="winner-sub">Glückwunsch!</div>
      </div>
    </div>
  </div>

  <script>
    // Erweiterte Checkout-Tabelle (Standard Double-Out)
    const commonCheckouts = {
      170: 'T20 T20 Bull', 167: 'T20 T19 Bull', 164: 'T20 T18 Bull', 161: 'T20 T17 Bull',
      160: 'T20 T20 D20', 158: 'T20 T20 D19', 157: 'T20 T19 D20', 156: 'T20 T20 D18',
      155: 'T20 T19 D19', 154: 'T20 T18 D20', 153: 'T20 T19 D18', 152: 'T20 T20 D16',
      151: 'T20 T17 D20', 150: 'T20 T18 D18', 149: 'T20 T19 D16', 148: 'T20 T16 D20',
      147: 'T20 T17 D18', 146: 'T20 T18 D16', 145: 'T20 T15 D20', 144: 'T20 T20 D12',
      143: 'T20 T17 D16', 142: 'T20 T14 D20', 141: 'T20 T19 D12', 140: 'T20 T20 D10',
      139: 'T20 T13 D20', 138: 'T20 T18 D12', 137: 'T20 T19 D10', 136: 'T20 T20 D8',
      135: 'T20 T17 D12', 134: 'T20 T14 D16', 133: 'T20 T19 D8', 132: 'T20 T16 D12',
      131: 'T20 T13 D16', 130: 'T20 T20 D5', 129: 'T19 T16 D20', 128: 'T18 T14 D20',
      127: 'T20 T17 D8', 126: 'T19 T19 D6', 125: 'T20 T19 D4', 124: 'T20 T16 D8',
      123: 'T19 T16 D18', 122: 'T18 T18 D7', 121: 'T20 T11 D14', 120: 'T20 20 D20',
      119: 'T19 T12 D20', 118: 'T20 18 D20', 117: 'T20 17 D20', 116: 'T20 16 D20',
      115: 'T20 15 D20', 114: 'T20 14 D20', 113: 'T20 13 D20', 112: 'T20 12 D20',
      111: 'T20 11 D20', 110: 'T20 10 D20', 109: 'T20 9 D20', 108: 'T20 8 D20',
      107: 'T19 10 D20', 106: 'T20 6 D20', 105: 'T20 5 D20', 104: 'T20 4 D20',
      103: 'T19 6 D20', 102: 'T20 10 D16', 101: 'T17 10 D20', 100: 'T20 D20',
      99: 'T19 10 D16', 98: 'T20 D19', 97: 'T19 D20', 96: 'T20 D18',
      95: 'T19 D19', 94: 'T18 D20', 93: 'T19 D18', 92: 'T20 D16',
      91: 'T17 D20', 90: 'T20 D15', 89: 'T19 D16', 88: 'T20 D14',
      87: 'T17 D18', 86: 'T18 D16', 85: 'T15 D20', 84: 'T20 D12',
      83: 'T17 D16', 82: 'T14 D20', 81: 'T19 D12', 80: 'T20 D10',
      79: 'T13 D20', 78: 'T18 D12', 77: 'T19 D10', 76: 'T20 D8',
      75: 'T17 D12', 74: 'T14 D16', 73: 'T19 D8', 72: 'T16 D12',
      71: 'T13 D16', 70: 'T10 D20', 69: 'T19 D6', 68: 'T20 D4',
      67: 'T17 D8', 66: 'T10 D18', 65: 'T19 D4', 64: 'T16 D8',
      63: 'T13 D12', 62: 'T10 D16', 61: 'T15 D8', 60: '20 D20',
      59: '19 D20', 58: '18 D20', 57: '17 D20', 56: '16 D20',
      55: '15 D20', 54: '14 D20', 53: '13 D20', 52: '12 D20',
      51: '11 D20', 50: 'Bull', 49: '9 D20', 48: '16 D16',
      47: '15 D16', 46: '14 D16', 45: '13 D16', 44: '12 D16',
      43: '11 D16', 42: '10 D16', 41: '9 D16', 40: 'D20',
      39: '7 D16', 38: 'D19', 37: '5 D16', 36: 'D18',
      35: '3 D16', 34: 'D17', 33: '1 D16', 32: 'D16',
      31: '15 D8', 30: 'D15', 29: '13 D8', 28: 'D14',
      27: '11 D8', 26: 'D13', 25: '9 D8', 24: 'D12',
      23: '7 D8', 22: 'D11', 21: '5 D8', 20: 'D10',
      19: '3 D8', 18: 'D9', 17: '1 D8', 16: 'D8',
      15: '7 D4', 14: 'D7', 13: '5 D4', 12: 'D6',
      11: '3 D4', 10: 'D5', 9: '1 D4', 8: 'D4',
      7: '3 D2', 6: 'D3', 5: '1 D2', 4: 'D2',
      3: '1 D1', 2: 'D1'
    };

    function getCheckout(score) {
      if (!score || score > 170 || score === 0) return null;
      if (commonCheckouts[score]) return commonCheckouts[score];
      if (score <= 40 && score % 2 === 0) return 'D' + (score / 2);
      return null;
    }

    async function loadState() {
      try {
        const res = await fetch('/api/state');
        const data = await res.json();
        render(data);
      } catch (e) {
        console.error(e);
      }
    }

    function render(data) {
      const screen = document.getElementById('screen');
      const grid = document.getElementById('grid');
      const meta = document.getElementById('meta');
      const overlay = document.getElementById('winner-overlay');
      const winnerName = document.getElementById('winner-name');
      const checkoutBar = document.getElementById('checkout-bar');
      const checkoutText = document.getElementById('checkout-text');
      const checkoutPlayer = document.getElementById('checkout-player');

      const showWinner = data.gameOver && data.winner;
      const showIdle = !data.players || data.players.length === 0 || (!data.active && !showWinner);

      if (showIdle) {
        screen.className = 'screen idle';
        grid.innerHTML = '';
        grid.className = 'grid';
        overlay.classList.remove('show');
        checkoutBar.classList.remove('visible');
        return;
      }

      const n = data.players.length;
      screen.className = 'screen live';
      grid.className = 'grid players-' + Math.min(Math.max(n, 1), 4);
      meta.innerHTML = `Modus: <span>${data.mode || '—'}</span> &nbsp;·&nbsp; Runde: <span>${data.round || 1}</span>`;

      if (showWinner) {
        winnerName.textContent = data.winner;
        overlay.classList.add('show');
        checkoutBar.classList.remove('visible');
      } else {
        overlay.classList.remove('show');

        const current = data.players[data.currentPlayer];
        const hint = current ? getCheckout(current.score) : null;
        if (hint && current) {
          checkoutText.textContent = hint;
          checkoutPlayer.textContent = current.name + ' · ' + current.score + ' Rest';
          checkoutBar.classList.add('visible');
        } else {
          checkoutBar.classList.remove('visible');
        }
      }

      grid.innerHTML = data.players.map((p, idx) => {
        const isActive = !data.gameOver && idx === data.currentPlayer;
        const isWinner = data.gameOver && data.winner === p.name;
        let cls = 'card';
        if (isActive) cls += ' active';
        if (isWinner) cls += ' winner';
        let badge = '';
        if (isActive) badge = '<div class="badge active">AM ZUG</div>';
        if (isWinner) badge = '<div class="badge winner">SIEGER</div>';
        return `
          <div class="${cls}">
            <div class="card-name">${p.name}</div>
            <div class="card-score">${p.score}</div>
            <div class="card-meta">${p.dartsThrown || 0} Darts</div>
            ${badge}
          </div>
        `;
      }).join('');
    }

    loadState();
    setInterval(loadState, 800);
  </script>
</body>
</html>
