<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contes Dart – Anzeige</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      color: #e8e8f0;
      font-family: 'Rajdhani', system-ui, sans-serif;
      overflow: hidden;
    }
    .screen {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: #000;
      position: relative;
    }
    .header {
      display: none;
      justify-content: space-between;
      align-items: baseline;
      padding: 1.4rem 2rem 1rem;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .screen.live .header { display: flex; }
    .title {
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: clamp(1.2rem, 3vw, 2rem);
      letter-spacing: 0.14em;
      background: linear-gradient(135deg, #00f0ff, #ff00aa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .meta {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(0.9rem, 2vw, 1.2rem);
      color: #8a8aa0;
      letter-spacing: 0.08em;
    }
    .meta span { color: #e8e8f0; font-weight: 700; }

    .grid {
      display: none;
      flex: 1;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1.2rem;
      padding: 1.2rem 2rem 0.5rem;
      align-content: center;
    }
    .screen.live .grid { display: grid; }

    .card {
      background: #0a0a12;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 24px;
      padding: 1.6rem 1.2rem;
      text-align: center;
      transition: all 0.3s ease;
    }
    .card.active {
      border-color: #00f0ff;
      box-shadow: 0 0 40px rgba(0,240,255,0.25);
      transform: scale(1.04);
    }
    .card.winner {
      border-color: #00ff88;
      box-shadow: 0 0 50px rgba(0,255,136,0.3);
    }
    .card-name {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(1rem, 2.2vw, 1.4rem);
      letter-spacing: 0.08em;
      color: #8a8aa0;
      margin-bottom: 0.5rem;
    }
    .card.active .card-name { color: #00f0ff; }
    .card.winner .card-name { color: #00ff88; }
    .card-score {
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: clamp(3.8rem, 14vw, 8rem);
      line-height: 1;
      color: #e8e8f0;
    }
    .card.active .card-score { color: #00f0ff; }
    .card.winner .card-score { color: #00ff88; }
    .card-meta {
      margin-top: 0.7rem;
      font-size: clamp(0.95rem, 1.8vw, 1.2rem);
      color: #8a8aa0;
    }
    .badge {
      display: inline-block;
      margin-top: 0.7rem;
      padding: 0.25rem 0.75rem;
      border-radius: 999px;
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      font-weight: 700;
    }
    .badge.active {
      background: rgba(0,240,255,0.15);
      color: #00f0ff;
    }
    .badge.winner {
      background: rgba(0,255,136,0.15);
      color: #00ff88;
    }

    /* Checkout-Leiste unten */
    .checkout-bar {
      display: none;
      margin: 0.5rem 2rem 1.5rem;
      padding: 1rem 1.4rem;
      border-radius: 16px;
      background: rgba(0, 255, 136, 0.08);
      border: 1px solid rgba(0, 255, 136, 0.3);
      text-align: center;
    }
    .screen.live .checkout-bar.visible { display: block; }
    .checkout-label {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(0.75rem, 1.5vw, 0.95rem);
      letter-spacing: 0.15em;
      color: #8a8aa0;
      margin-bottom: 0.35rem;
    }
    .checkout-text {
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      font-size: clamp(1.3rem, 3.5vw, 2.2rem);
      letter-spacing: 0.06em;
      color: #00ff88;
    }
    .checkout-player {
      margin-top: 0.35rem;
      font-size: clamp(0.9rem, 1.8vw, 1.1rem);
      color: #00f0ff;
    }

    .winner-overlay {
      position: absolute;
      inset: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      background: rgba(0, 0, 0, 0.92);
      backdrop-filter: blur(18px);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.4s ease, visibility 0.4s;
    }
    .winner-overlay.show {
      opacity: 1;
      visibility: visible;
    }
    .winner-card {
      min-width: min(92vw, 760px);
      text-align: center;
      padding: 2.8rem 2.4rem;
      border-radius: 32px;
      background: rgba(10, 10, 18, 0.96);
      border: 1px solid rgba(0, 255, 136, 0.35);
      box-shadow: 0 0 0 1px rgba(0, 255, 136, 0.16), 0 24px 80px rgba(0, 0, 0, 0.6);
      animation: winnerPop 0.55s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes winnerPop {
      0% { transform: scale(0.4); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .winner-label {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(1.05rem, 2.6vw, 1.45rem);
      letter-spacing: 0.28em;
      color: #00ff88;
      margin-bottom: 1rem;
      text-transform: uppercase;
    }
    .winner-name {
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: clamp(3.4rem, 15vw, 8rem);
      letter-spacing: 0.08em;
      line-height: 1.05;
      background: linear-gradient(135deg, #00ff88, #00f0ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: winnerGlow 0.7s ease-in-out infinite alternate;
    }
    @keyframes winnerGlow {
      from { filter: drop-shadow(0 0 14px rgba(0,255,136,0.4)); }
      to   { filter: drop-shadow(0 0 45px rgba(0,255,136,0.95)); }
    }
    .winner-sub {
      margin-top: 1.4rem;
      color: #8a8aa0;
      font-size: clamp(1rem, 2vw, 1.3rem);
      letter-spacing: 0.08em;
    }
  </style>
</head>
<body>
  <div class="screen idle" id="screen">
    <div class="header">
      <div class="title">CONTES DART</div>
      <div class="meta" id="meta"></div>
    </div>

    <div class="grid" id="grid"></div>

    <div class="checkout-bar" id="checkout-bar">
      <div class="checkout-label">CHECKOUT</div>
      <div class="checkout-text" id="checkout-text">—</div>
      <div class="checkout-player" id="checkout-player"></div>
    </div>

    <div class="winner-overlay" id="winner-overlay">
      <div class="winner-card">
        <div class="winner-label">GEWINNER</div>
        <div class="winner-name" id="winner-name">—</div>
        <div class="winner-sub">Glückwunsch!</div>
      </div>
    </div>
  </div>

  <script>
    const commonCheckouts = {
      170: 'T20 T20 Bull', 167: 'T20 T19 Bull', 164: 'T20 T18 Bull', 161: 'T20 T17 Bull',
      160: 'T20 T20 D20', 158: 'T20 T20 D19', 157: 'T20 T19 D20', 156: 'T20 T20 D18',
      155: 'T20 T19 D19', 154: 'T20 T18 D20', 152: 'T20 T20 D16', 151: 'T20 T17 D20',
      150: 'T20 T18 D18', 149: 'T20 T19 D16', 148: 'T20 T16 D20', 147: 'T20 T17 D18',
      146: 'T20 T18 D16', 145: 'T20 T15 D20', 144: 'T20 T20 D12', 143: 'T20 T17 D16',
      142: 'T20 T14 D20', 141: 'T20 T19 D12', 140: 'T20 T20 D10', 136: 'T20 T20 D8',
      132: 'T20 T16 D12', 130: 'T20 T20 D5', 120: 'T20 20 D20', 110: 'T20 10 D20',
      100: 'T20 D20', 98: 'T20 D19', 96: 'T20 D18', 80: 'T20 D10', 60: '20 D20',
      50: 'Bull', 40: 'D20', 36: 'D18', 32: 'D16', 24: 'D12', 20: 'D10',
      16: 'D8', 12: 'D6', 10: 'D5', 8: 'D4', 6: 'D3', 4: 'D2', 2: 'D1'
    };

    function getCheckout(score) {
      if (!score || score > 170 || score === 0) return null;
      if (commonCheckouts[score]) return commonCheckouts[score];
      if (score <= 40 && score % 2 === 0) return 'D' + (score / 2);
      return null;
    }

    let lastRenderedState = null;

    async function loadState() {
      try {
        const res = await fetch('/api/state');
        const data = await res.json();
        if (JSON.stringify(data) !== JSON.stringify(lastRenderedState)) {
          lastRenderedState = data;
          render(data);
        }
      } catch (e) {
        console.error(e);
      }
    }

    function render(data) {
      const screen = document.getElementById('screen');
      const grid = document.getElementById('grid');
      const meta = document.getElementById('meta');
      const overlay = document.getElementById('winner-overlay');
      const winnerName = document.getElementById('winner-name');
      const checkoutBar = document.getElementById('checkout-bar');
      const checkoutText = document.getElementById('checkout-text');
      const checkoutPlayer = document.getElementById('checkout-player');
      const players = data.players || [];

      screen.className = 'screen live';
      meta.innerHTML = `Modus: <span>${data.mode || '—'}</span> &nbsp;·&nbsp; Runde: <span>${data.round || 1}</span>`;

      if (data.gameOver && data.winner) {
        winnerName.textContent = data.winner;
        overlay.classList.add('show');
        checkoutBar.classList.remove('visible');
        grid.innerHTML = players.map((p, idx) => {
          const isActive = false;
          const isWinner = data.winner === p.name;
          let cls = 'card';
          if (isActive) cls += ' active';
          if (isWinner) cls += ' winner';
          return `
            <div class="${cls}">
              <div class="card-name">${p.name}</div>
              <div class="card-score">${p.score}</div>
              <div class="card-meta">${p.dartsThrown || 0} Darts</div>
              ${isWinner ? '<div class="badge winner">SIEGER</div>' : ''}
            </div>
          `;
        }).join('');
        return;
      }

      if (!data.active || players.length === 0) {
        screen.className = 'screen idle';
        grid.innerHTML = '';
        overlay.classList.remove('show');
        checkoutBar.classList.remove('visible');
        return;
      }

      overlay.classList.remove('show');

      // Checkout für aktuellen Spieler
      const current = players[data.currentPlayer];
      const hint = current ? getCheckout(current.score) : null;
      if (hint && current) {
        checkoutText.textContent = hint;
        checkoutPlayer.textContent = current.name + ' · ' + current.score + ' Rest';
        checkoutBar.classList.add('visible');
      } else {
        checkoutBar.classList.remove('visible');
      }

      grid.innerHTML = players.map((p, idx) => {
        const isActive = !data.gameOver && idx === data.currentPlayer;
        const isWinner = data.gameOver && data.winner === p.name;
        let cls = 'card';
        if (isActive) cls += ' active';
        if (isWinner) cls += ' winner';
        let badge = '';
        if (isActive) badge = '<div class="badge active">AM ZUG</div>';
        if (isWinner) badge = '<div class="badge winner">SIEGER</div>';
        return `
          <div class="${cls}">
            <div class="card-name">${p.name}</div>
            <div class="card-score">${p.score}</div>
            <div class="card-meta">${p.dartsThrown || 0} Darts</div>
            ${badge}
          </div>
        `;
      }).join('');
    }

    loadState();
    setInterval(loadState, 400);
  </script>
</body>
</html>
